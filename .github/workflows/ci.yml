name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest requests ruff
      - run: ruff check airflow tests spark
      - run: pytest -q

  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyspark==4.0.1" pytest
      - run: pytest -q spark/tests

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  dbt:
    runs-on: ubuntu-latest
    env:
      # dbt parse não conecta no BigQuery; os valores só precisam existir.
      GCP_PROJECT_ID: ci-sem-conexao
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/nao-usado.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "dbt-core==1.12.6" "dbt-bigquery==1.9.2"
      - run: dbt parse --project-dir dbt --profiles-dir dbt
