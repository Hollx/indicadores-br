name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest requests ruff
      - run: ruff check airflow tests spark farol
      - run: pytest -q

  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyspark==4.0.1" pytest
      - run: pytest -q spark/tests

  farol-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: farol/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  farol-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: farol/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: farol/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  dbt:
    runs-on: ubuntu-latest
    env:
      # dbt parse não conecta no BigQuery; os valores só precisam existir.
      GCP_PROJECT_ID: ci-sem-conexao
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/nao-usado.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "dbt-core==1.12.6" "dbt-bigquery==1.9.2"
      - run: dbt parse --project-dir dbt --profiles-dir dbt

  # CD: com tudo verde num push na main, atualiza a VPS. A chave de deploy só executa
  # scripts/deploy-ci.sh (comando forçado no authorized_keys); o SHA vai como argumento.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, spark, farol-api, farol-web, shell, terraform, dbt]
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: https://farol.173-212-242-68.sslip.io
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Chave de deploy
        env:
          CHAVE: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
      - name: Deploy na VPS
        env:
          DESTINO: ${{ secrets.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$DESTINO" "$GITHUB_SHA"
      - name: Farol respondendo pela internet
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://farol.173-212-242-68.sslip.io/api/saude
