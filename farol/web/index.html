<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Farol: monitoramento, governança, qualidade e visualização de um pipeline de dados público com indicadores econômicos do Brasil." />
    <link rel="icon" href="/farol.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Farol · pipeline indicadores-br</title>
    <script>
      // Aplica o tema salvo antes de pintar a página, para não piscar o tema errado.
      try {
        var t = localStorage.getItem("farol-tema");
        if (t === "claro" || t === "escuro") document.documentElement.setAttribute("data-tema", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
