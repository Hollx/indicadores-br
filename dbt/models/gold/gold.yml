version: 2

models:
  - name: fct_indicadores_mensais
    description: >
      Indicadores econômicos por mês (Selic meta média, dólar médio, IPCA e IGP-M mensais,
      IPCA acumulado em 12 meses). Fonte para o dashboard no Looker Studio.
    columns:
      - name: mes
        description: Primeiro dia do mês.
        data_tests:
          - unique
          - not_null
      - name: ipca_acumulado_12m
        description: Nulo enquanto a janela não tem 12 meses de IPCA.
